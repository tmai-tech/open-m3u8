plugins {
    id 'java-library'
    id 'idea'
}

// mpd-parser 0.7+ targets Java 10+; build with JDK 11+.
sourceCompatibility = '11'
targetCompatibility = '11'

dependencies {
    // 0.15+ publishes Java 21 Gradle metadata; 0.14 is the newest Central jar
    // that resolves on JDK 17. Fork/upgrade when we run JDK 21.
    api 'io.lindstrom:mpd-parser:0.14'
    testImplementation 'junit:junit:4.13.2'
}

java {
    withJavadocJar()
    withSourcesJar()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

test {
    useJUnit()
}
