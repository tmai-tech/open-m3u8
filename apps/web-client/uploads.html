<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uploads — HLS Demo</title>
  <link rel="stylesheet" href="css/demo.css" />
  <script type="module" src="js/uploads.js"></script>
</head>
<body class="ott uploads">
  <div class="app uploads-app">
    <header class="ott-nav">
      <div class="ott-brand">HLS Demo</div>
      <nav class="ott-tabs">
        <a href="./">Watch</a>
        <a href="uploads.html" aria-current="page">Uploads</a>
      </nav>
    </header>

    <p class="uploads-lead">
      Drop up to 3 MP4s here. Packaging runs in the packager process. Refresh a job (or this page) to
      see whether it finished — nothing is polled.
    </p>

    <label class="upload-drop" id="drop">
      <input id="file" type="file" accept="video/mp4,.mp4" multiple hidden />
      <strong>Upload MP4</strong>
      <span>Click or drop up to 3 files. Max 200MB each.</span>
    </label>
    <p class="status" id="status">Idle.</p>

    <section class="card uploads-jobs">
      <h3 class="section-title">Jobs</h3>
      <div id="jobList" class="job-list"></div>
    </section>
  </div>

  <div class="log-modal" id="logModal" hidden>
    <button type="button" class="log-modal-backdrop" id="logBackdrop" aria-label="Close log"></button>
    <div class="log-modal-card" role="dialog" aria-modal="true" aria-labelledby="logTitle">
      <div class="log-modal-head">
        <h3 class="section-title" id="logTitle">Log</h3>
        <button type="button" class="btn btn-ghost btn-sm" id="btnCloseLog">Close</button>
      </div>
      <p class="job-status" id="jobStatus">Select a job, then Refresh.</p>
      <pre class="manifest-box job-log" id="log">No log loaded.</pre>
    </div>
  </div>
</body>
</html>
