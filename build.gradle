plugins {
    id 'java'
    id 'idea'
}

repositories {
    mavenCentral()
}

group = 'com.iheartradio.m3u8'
version = '0.2.7-SNAPSHOT'

// Library remains source-compatible with Java 7 APIs; build with JDK 8+.
sourceCompatibility = '1.8'
targetCompatibility = '1.8'

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

java {
    withJavadocJar()
    withSourcesJar()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

def demoJvm = {
    it.group = 'application'
    it.classpath = sourceSets.main.runtimeClasspath
    it.mainClass = 'com.iheartradio.m3u8.demo.DemoPlayerServer'
    it.args = project.hasProperty('port') ? [project.property('port')] : []
    it.workingDir = project.projectDir
    it.jvmArgs = ['-Xms128m', '-Xmx768m']
}

task runDemo(type: JavaExec) {
    description = 'Run the HLS demo player (SSAI / SGAI strategy switch)'
    demoJvm(it)
}

task runHlsPlayer(type: JavaExec) {
    description = 'Alias for runDemo'
    demoJvm(it)
}

task runSsaiProxy(type: JavaExec) {
    description = 'Alias for runDemo'
    demoJvm(it)
}

test {
    useJUnit()
}
