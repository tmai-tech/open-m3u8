<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hls.js player — same origin</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.2/dist/hls.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0d12; color: #eef1f7; margin: 0; padding: 20px; }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    p { color: #8b95a8; font-size: .9rem; line-height: 1.4; }
    code { font-size: .85em; }
    .row { display: flex; gap: 8px; margin: 12px 0; }
    input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3347; background: #1c2230; color: #eef1f7; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: #5b8cff; color: #fff; }
    video { width: 100%; max-width: 960px; background: #000; aspect-ratio: 16/9; display: block; }
    .note { font-size: .82rem; color: #8b95a8; max-width: 960px; }
  </style>
</head>
<body>
  <h1>hls.js (same origin as the proxy)</h1>
  <p class="note">
    Public HTTPS demos (e.g. <code>https://hlsjs.video-dev.org</code>) cannot load
    <code>http://127.0.0.1</code> — the browser reports that as CORS / HTTP 0 (mixed content + local network).
    This page is served from the demo server, so there is no cross-origin block.
  </p>
  <div class="row">
    <input id="url" type="url" placeholder="http://127.0.0.1:8765/s/…/manifest" />
    <button id="go" type="button">Play</button>
  </div>
  <video id="video" controls playsinline></video>
  <script>
    const params = new URLSearchParams(location.search);
    const input = document.getElementById("url");
    const video = document.getElementById("video");
    let hls = null;
    if (params.get("url")) input.value = params.get("url");

    function play() {
      const src = input.value.trim();
      if (!src) return;
      if (hls) { hls.destroy(); hls = null; }
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, enableInterstitialPlayback: true });
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (d.fatal) console.error(d.type, d.details);
        });
      } else {
        video.src = src;
        video.play().catch(() => {});
      }
    }
    document.getElementById("go").onclick = play;
    if (input.value) play();
  </script>
</body>
</html>
